# chs — configuration
#
# This file is created on first run with every option and its default value.
# Anything you delete falls back to the built-in default (this very template,
# embedded in the binary), so you can also keep only the lines you change.
#
#   chs --config-path        where this file lives
#   chs --init-config        rewrite it with defaults (add --force to overwrite)
#   chs --dump-lang          print every UI string, as a starting point for a translation
#
# Paths accept `~` and environment variables written as ${VAR} or %VAR%. A source's
# `path` may also be a list: every folder of it that exists is read, and an entry
# using a variable that is not set is skipped - so one list covers every OS.

[general]
# Sessions shown before you type anything.
recent_count = 20
# How many of the most recent sessions the search looks through.
search_pool = 200
# How many best matches are shown while searching.
result_count = 20
# Translation file (TOML). Empty = built-in English.
# Start one with `chs --dump-lang > ~/.config/chs/uk.toml`, translate the values,
# then point this at it. Missing keys fall back to English. No rebuild needed.
language_file = ""
# Where the session index is cached. Empty = the OS cache folder
# (~/.cache/chs on Linux, %LOCALAPPDATA%\chs on Windows).
cache_dir = ""
# What happens when you pick a session:
#   "exit"   - chs gets out of the way: the session takes over this terminal and chs
#              is gone (on Linux/macOS the chs process is replaced, it keeps no memory).
#   "return" - when the resumed session ends, you come back to the chs list.
after_resume = "exit"
# The session's folder no longer exists: "home" (resume from your home folder),
# "current" (from the folder chs was started in) or "abort" (show an error).
missing_cwd = "home"
# Esc first clears the search; a second Esc quits. false = Esc always quits.
esc_clears_query = true
# true: your [[sources]] are merged into the built-in list by name (see the end of
# this file). false: only the [[sources]] written in your config are used.
builtin_sources = true

[display]
# Columns in the list, left to right. Available: "source", "date", "folder", "title".
columns = ["source", "date", "folder", "title"]
# strftime format for the date column (see https://docs.rs/chrono/latest/chrono/format/strftime).
date_format = "%Y-%m-%d %H:%M"
# Show "5m", "3h", "2d" instead of the date for sessions newer than a week.
relative_dates = false
# Folder column: "name" (last path component), "tilde" (~/projects/x), "full".
folder_style = "name"
folder_width = 22
source_width = 9
# Mark sessions that were run non-interactively (claude -p, codex exec, ...).
show_headless_tag = true
headless_tag = "⚙"
# Symbol in front of the selected row.
highlight_symbol = "▶ "
# Frame style: "rounded", "plain", "double", "thick", "none".
border = "rounded"
# Preview panel with the session's details and first/last prompts.
preview = true
# "right", "bottom" or "auto" (right when the terminal is at least preview_auto_width wide).
preview_position = "auto"
preview_auto_width = 140
# Share of the screen the preview takes, in percent.
preview_size = 45
# How many of the first and of the last prompts the preview shows.
preview_first_prompts = 3
preview_last_prompts = 2
# Characters of each prompt shown in the preview.
preview_prompt_chars = 400
# Key hints at the bottom.
show_help = true
# 0 = full screen. Any other number = draw inline below the prompt using that many
# rows, like `fzf --height`, leaving your scrollback visible.
height = 0

[search]
# Weight of each field in the ranking.
weight_title = 3.0
weight_folder = 2.0
weight_prompts = 1.0
# "smart" (case-insensitive unless you type a capital), "ignore", "respect".
case = "smart"
# Treat letters with diacritics as their base letter (é ≈ e).
normalize = true
# 0.0-1.0. Fuzzy matches weaker than this share of a perfect match are dropped,
# so stray letters scattered through a long prompt do not count as a hit.
min_quality = 0.45
# A fuzzy match may stretch over at most this many times the typed length (+2 chars),
# so it stays inside about one word: "перерб" finds "переробити", while letters picked
# from five different words of a long prompt do not count.
max_spread = 1.5
# 0.0 = rank purely by match quality; higher values favour more recent sessions.
recency_weight = 0.15
# Text indexed per session (prompts beyond this keep only the first and the latest).
max_indexed_chars = 40000
# Characters kept of a single prompt (huge pastes are cut).
max_prompt_chars = 4000
# Search syntax (fzf style): words are ANDed, 'exact  ^prefix  suffix$  !exclude.

[theme]
# Colors: "#rrggbb", a name ("red", "lightblue", "darkgray", ...), a 0-255 index,
# or "" / "reset" for the terminal default.
selected_bg = "#2c313c"
selected_fg = ""
match_fg = "#ffd75f"
date_fg = "#7f8796"
folder_fg = "#61afef"
title_fg = ""
headless_fg = "#7f8796"
border_fg = "#4b5263"
query_fg = "#e5c07b"
prompt_symbol = "❯ "
help_fg = "#7f8796"

[keys]
# Each action takes a list of keys. Letters and digits always go into the search,
# so actions use special keys or Ctrl/Alt combinations.
# Names: up down left right home end pageup pagedown enter esc tab backtab backspace
# delete insert f1..f12, a single character, and modifiers ctrl- alt- shift-.
up = ["up", "ctrl-p"]
down = ["down", "ctrl-n"]
page_up = ["pageup"]
page_down = ["pagedown"]
first = ["ctrl-home"]
last = ["ctrl-end"]
resume = ["enter"]
# Print the resume command instead of running it.
print_command = ["ctrl-o", "f4"]
quit = ["esc", "ctrl-c", "ctrl-q"]
clear_query = ["ctrl-u"]
delete_word = ["ctrl-w", "ctrl-backspace", "alt-backspace"]
toggle_preview = ["ctrl-t", "f2"]
# Show / hide non-interactive sessions for this run.
toggle_headless = ["ctrl-a", "f3"]
# Cycle through: all sources -> each source alone.
next_source = ["tab"]
prev_source = ["backtab"]
# Re-read every session file, ignoring the cache.
reindex = ["ctrl-r", "f5"]
cursor_left = ["left"]
cursor_right = ["right"]
cursor_home = ["home"]
cursor_end = ["end"]

[linux]
# Applies to Linux and macOS. On every start chs makes sure `chs` can be called
# from any shell by linking the running binary into link_dir. false = remove that
# link again (only if it points to this binary).
add_to_path = true
link_dir = "/usr/local/bin"
# Use `sudo -n` (never asks for a password) when link_dir is not writable.
use_sudo = true
# Used when link_dir can not be written even with sudo.
fallback_dir = "~/.local/bin"

[windows]
# On every start chs.exe / chs-tray.exe sync these with the system, so turning an
# option off here removes what it added.
# Add the folder with chs.exe to the user PATH (HKCU\Environment).
add_to_path = true
# Allow the tray icon at all. false = chs-tray.exe exits right away.
tray_enabled = true
# Start the tray with Windows (HKCU\...\CurrentVersion\Run). Always uses the full path.
tray_autostart = true
# Running chs.exe also starts the tray if it is not running yet.
start_tray_with_cli = true
# Terminal the tray opens chs in:
#   "auto"    - the Windows default terminal (Windows Terminal or the classic console)
#   "wt"      - Windows Terminal, new window
#   "conhost" - the classic console window
#   "custom"  - terminal_command below; {chs} is replaced by the full path to chs.exe
terminal = "auto"
terminal_command = ["wt.exe", "-w", "0", "new-tab", "--title", "chs", "{chs}"]
tray_tooltip = "chs - AI session history"
# What a left click on the tray icon does: "open" (open chs) or "menu".
tray_left_click = "open"
# Program used by the tray's "Edit config".
editor = "notepad.exe"

# ---------------------------------------------------------------------------------
# Session sources, in the order the source filter (Tab) cycles through them; Tab
# skips sources that have no sessions. A source whose folders do not exist costs
# nothing and is skipped silently.
#
# Your own [[sources]] entries are merged into these by `name`: write only what you
# change (`name = "gemini"` plus `enabled = false` turns one off), and an entry with a
# new name adds a source. [general] builtin_sources = false uses only the entries in
# your file instead.
#
#   name             label shown in the list (keep it short)
#   format           which tool wrote the sessions; several tools share one, e.g.
#                    Qoder, iFlow and Kode write Claude Code's format
#   path             the tool's data folder, or a list of candidates (every one that
#                    exists is read)
#   color            color of the label
#   enabled          false = ignore this source
#   include_headless show sessions the tool marks as non-interactive or spawned
#                    (claude -p / SDK, codex exec, subagents...). Ctrl+A toggles them.
#   headless_markers the marker values that count as headless; leave out for the
#                    format's defaults
#   resume_command   program and arguments; {id} = session id, {cwd} = its folder,
#                    {file} = the session file. Runs inside the session's folder.
# ---------------------------------------------------------------------------------

[[sources]]
name = "claude"
format = "claude"
path = "~/.claude"
color = "#D97757"
resume_command = ["claude", "--resume", "{id}"]

[[sources]]
name = "claudellm"
format = "claude"
path = "~/.claudellm"
color = "#C678DD"
resume_command = ["claudellm", "--resume", "{id}"]

[[sources]]
name = "codex"
format = "codex"
path = ["${CODEX_HOME}", "~/.codex"]
color = "#10A37F"
resume_command = ["codex", "resume", "{id}"]

# Gemini CLI: tmp/<project>/chats/session-*.jsonl (older builds: *.json).
[[sources]]
name = "gemini"
format = "gemini"
path = ["${GEMINI_CLI_HOME}/.gemini", "~/.gemini"]
color = "#4285F4"
resume_command = ["gemini", "--resume", "{id}"]

# GitHub Copilot CLI: session-state/<id>/events.jsonl.
[[sources]]
name = "copilot"
format = "copilot"
path = ["${COPILOT_HOME}", "~/.copilot"]
color = "#8957E5"
resume_command = ["copilot", "--resume={id}"]

# Cursor CLI: chats/*/<id>/meta.json, prompts from projects/*/agent-transcripts.
[[sources]]
name = "cursor"
format = "cursor"
path = ["${CURSOR_CONFIG_DIR}", "${XDG_CONFIG_HOME}/cursor", "~/.cursor"]
color = "#CFCFCF"
resume_command = ["agent", "--resume", "{id}"]

# OpenCode: one SQLite database, opencode.db, in this folder (same path on Windows).
[[sources]]
name = "opencode"
format = "opencode"
path = ["${XDG_DATA_HOME}/opencode", "~/.local/share/opencode"]
color = "#E5C07B"
resume_command = ["opencode", "--session", "{id}"]

# Kilo Code CLI, an OpenCode fork: kilo.db.
[[sources]]
name = "kilo"
format = "kilo"
path = ["${XDG_DATA_HOME}/kilo", "~/.local/share/kilo"]
color = "#F8F675"
resume_command = ["kilo", "--session", "{id}"]

# Crush: a database per project (<project>/.crush/crush.db), found through the
# projects.json in its global data folder.
[[sources]]
name = "crush"
format = "crush"
path = ["${CRUSH_GLOBAL_DATA}", "${XDG_DATA_HOME}/crush", "~/.local/share/crush", "%LOCALAPPDATA%/crush"]
color = "#FF6EC7"
resume_command = ["crush", "--session", "{id}"]

# Goose: sessions/sessions.db in its data folder.
[[sources]]
name = "goose"
format = "goose"
path = ["${GOOSE_PATH_ROOT}/data", "${XDG_DATA_HOME}/goose", "~/.local/share/goose", "%APPDATA%/Block/goose/data"]
color = "#A0A0A0"
resume_command = ["goose", "session", "--resume", "--session-id", "{id}"]

# Pi: sessions/--<folder>--/*.jsonl. Resumed by file, which works from anywhere.
[[sources]]
name = "pi"
format = "pi"
path = ["${PI_CODING_AGENT_DIR}", "~/.pi/agent"]
color = "#56B6C2"
resume_command = ["pi", "--session", "{file}"]

# Factory Droid: sessions/<project>/<id>.jsonl.
[[sources]]
name = "droid"
format = "droid"
path = ["${FACTORY_HOME_OVERRIDE}/.factory", "~/.factory"]
color = "#EF6F6C"
resume_command = ["droid", "--resume", "{id}"]

# Qwen Code: projects/<folder>/chats/<id>.jsonl.
[[sources]]
name = "qwen"
format = "qwen"
path = ["${QWEN_RUNTIME_DIR}", "${QWEN_HOME}", "~/.qwen"]
color = "#615CED"
resume_command = ["qwen", "--resume", "{id}"]

# Kimi Code: sessions/<workspace>/<id>/state.json + agents/main/wire.jsonl.
[[sources]]
name = "kimi"
format = "kimi"
path = ["${KIMI_CODE_HOME}", "~/.kimi-code"]
color = "#2EA8FF"
resume_command = ["kimi", "--session", "{id}"]

# The archived Python Kimi CLI (its data stays in ~/.kimi after `kimi migrate`).
[[sources]]
name = "kimi-cli"
format = "kimi-cli"
path = ["${KIMI_SHARE_DIR}", "~/.kimi"]
color = "#1C6FB8"
resume_command = ["kimi", "--session", "{id}"]

# DeepSeek Harness: sessions/--<folder>--/<id>/session.v<N>.jsonl.zstd. dsh has no
# interactive resume of its own: this continues the session headless, with the next
# task read from the terminal (type it, then Ctrl+D). ["dsh", "web"] opens the web UI.
[[sources]]
name = "dsh"
format = "dsh"
path = ["${DSH_HOME}/sessions", "~/.dsh/sessions"]
color = "#4D6BFE"
resume_command = ["dsh", "headless", "--session-id", "{id}", "-"]

# Hermes Agent: state.db (the default profile).
[[sources]]
name = "hermes"
format = "hermes"
path = ["${HERMES_HOME}", "~/.hermes", "%LOCALAPPDATA%/hermes"]
color = "#D4A72C"
resume_command = ["hermes", "--resume", "{id}"]

# Google Antigravity CLI: conversation_summaries.db + history.jsonl.
[[sources]]
name = "agy"
format = "antigravity"
path = "~/.gemini/antigravity-cli"
color = "#34A853"
resume_command = ["agy", "--conversation", "{id}"]

# Mistral Vibe: logs/session/unified/<id>/meta.json (3.x) and session_*/ (2.x).
[[sources]]
name = "vibe"
format = "vibe"
path = ["${VIBE_HOME}/logs/session", "~/.vibe/logs/session"]
color = "#FA520F"
resume_command = ["vibe", "--resume", "{id}"]

# Cline CLI: data/sessions/<id>/<id>.json + <id>.messages.json.
[[sources]]
name = "cline"
format = "cline"
path = ["${CLINE_DATA_DIR}", "${CLINE_DIR}/data", "~/.cline/data"]
color = "#9ECBFF"
resume_command = ["cline", "--id", "{id}", "--cwd", "{cwd}"]

# Continue's cn (and its IDE extensions): sessions/<id>.json. cn has no resume by id;
# --fork continues the history in a new session.
[[sources]]
name = "continue"
format = "continue"
path = ["${CONTINUE_GLOBAL_DIR}", "~/.continue"]
color = "#BE6FD8"
resume_command = ["cn", "--fork", "{id}"]

# Augment's auggie: sessions/<id>.json.
[[sources]]
name = "auggie"
format = "auggie"
path = "~/.augment"
color = "#5BC0EB"
resume_command = ["auggie", "--resume", "{id}"]

# OpenHands CLI: conversations/<id>/base_state.json + events/.
[[sources]]
name = "openhands"
format = "openhands"
path = ["${OPENHANDS_CONVERSATIONS_DIR}", "${OPENHANDS_PERSISTENCE_DIR}", "~/.openhands"]
color = "#E8C547"
resume_command = ["openhands", "--resume", "{id}"]

# Amazon Q Developer CLI: data.sqlite3, one conversation per folder.
[[sources]]
name = "amazon-q"
format = "amazonq"
path = ["${XDG_DATA_HOME}/amazon-q", "~/.local/share/amazon-q", "~/Library/Application Support/amazon-q", "%LOCALAPPDATA%/amazon-q"]
color = "#FF9900"
resume_command = ["q", "chat", "--resume"]

# Tencent CodeBuddy Code: projects/<folder>/<id>.jsonl.
[[sources]]
name = "codebuddy"
format = "codebuddy"
path = ["${CODEBUDDY_CONFIG_DIR}", "~/.codebuddy"]
color = "#3D7EFF"
resume_command = ["codebuddy", "--resume", "{id}"]

# Qoder CLI writes Claude Code's transcript format.
[[sources]]
name = "qoder"
format = "claude"
path = ["${QODER_CONFIG_DIR}", "${QODER_CLI_HOME}/.qoder", "~/.qoder", "~/.qoder-cn"]
color = "#2ADB5C"
resume_command = ["qodercli", "--resume", "{id}"]

# iFlow CLI, also in Claude Code's format.
[[sources]]
name = "iflow"
format = "claude"
path = ["${IFLOW_HOME}", "~/.iflow"]
color = "#7B61FF"
resume_command = ["iflow", "--resume", "{id}"]

# Kode, also in Claude Code's format.
[[sources]]
name = "kode"
format = "claude"
path = ["${KODE_CONFIG_DIR}", "${ANYKODE_CONFIG_DIR}", "~/.kode"]
color = "#00B3B3"
resume_command = ["kode", "--resume", "{id}"]

# Aider keeps .aider.chat.history.md inside each repository, with no list of them
# anywhere: it is looked for in the folder of every session the other sources found,
# and below the folders in `path` (3 levels deep), e.g. ["~/projects"]. One entry per
# repository; resuming loads that repository's whole chat history.
[[sources]]
name = "aider"
format = "aider"
path = []
color = "#14B014"
resume_command = ["aider", "--restore-chat-history"]
