[package]
name = "chs"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
description = "Browse, fuzzy-search and resume your recent terminal AI agent sessions (Claude Code, Codex, Gemini, Copilot, Cursor, OpenCode, Pi, Kimi, dsh, Aider and more)"
license = "MIT"
repository = "https://github.com/sergqwer/chs"
readme = "README.md"
keywords = ["claude", "codex", "gemini", "tui", "history"]
categories = ["command-line-utilities"]

[[bin]]
name = "chs"
path = "src/main.rs"

[[bin]]
name = "chs-tray"
path = "src/bin/chs-tray.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
memchr = "2"
md-5 = "0.10"
ruzstd = "0.8"
nucleo-matcher = "0.3"
ratatui = "0.30"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
which = "8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3"
